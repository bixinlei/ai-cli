[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "0.1.0"
description = "零依赖的命令行 AI 助手,支持任意 OpenAI 兼容 API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ai", "cli", "chatgpt", "openai", "command-line", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
ai-cli = "aicli.cli:main"

[tool.setuptools]
packages = ["aicli"]
